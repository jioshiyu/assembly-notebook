name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fasm
        run: sudo apt-get update && sudo apt-get install -y fasm
      - name: Assemble + fixed cases
        run: python shared/check.py
      - name: Random stress (30 rounds each)
        run: python shared/check.py --stress 30
      - name: Mutation testing (tests must catch the bugs)
        run: python shared/check.py --mutate 4
      - name: Install unicorn (independent oracle)
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Cross-check with Unicorn Engine
        run: python shared/oracle_unicorn.py
